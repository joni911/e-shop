<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)">
  <title>Register — Sistem Pengadaan Tender</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/base.css?v=3" rel="stylesheet">
  <link href="css/components.css?v=3" rel="stylesheet">
  <link href="css/pages.css?v=3" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="max-width:520px;">
      <div class="auth-logo">
        <img src="logo.png?v=3" class="auth-logo-img" alt="Logo Pengadaan Tender">
        <h1>Sistem Pengadaan Tender</h1>
        <p>Buat akun baru</p>
      </div>

      <form action="#" method="POST" data-validate>
        <div class="form-group">
          <label class="form-label">Nama / Nama PT <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" placeholder="Nama lengkap atau nama perusahaan" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" name="email" class="form-control" placeholder="nama@email.com" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Password <span class="text-danger">*</span></label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label class="form-label">Konfirmasi Password <span class="text-danger">*</span></label>
            <input type="password" name="password_confirmation" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">Register</button>
      </form>

      <div class="auth-footer">
        Sudah punya akun? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
