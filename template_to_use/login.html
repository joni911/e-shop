<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)">
  <title>Login — Sistem Pengadaan Tender</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/base.css?v=3" rel="stylesheet">
  <link href="css/components.css?v=3" rel="stylesheet">
  <link href="css/pages.css?v=3" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="logo.png?v=3" class="auth-logo-img" alt="Logo Pengadaan Tender">
        <h1>Sistem Pengadaan Tender</h1>
        <p>Masuk ke akun Anda</p>
      </div>

      <form action="#" method="POST" data-validate>
        <div class="form-group">
          <label class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" name="email" class="form-control" placeholder="nama@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password <span class="text-danger">*</span></label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <label class="d-flex align-items-center gap-2" style="font-size:0.875rem;color:var(--fg-muted);cursor:pointer;">
            <input type="checkbox" name="remember" style="width:16px;height:16px;accent-color:var(--primary);">
            Ingat saya
          </label>
          <a href="#" class="text-sm">Lupa password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <div class="auth-footer">
        Belum punya akun? <a href="register.html">Daftar sekarang</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
