            <a href="tender-admin-form.html" class="btn btn-primary">

              Tambah Tender

          </div>

        <!-- Search & Filter -->
        <div class="card mb-4">
          <div class="card-body">
            <div class="row g-3 align-items-end">
              <div class="col-12 col-md-5">
                <label class="form-label">Cari Tender</label>
                <input type="text" class="form-control" placeholder="Nama tender, kode paket..." data-table-search="tenderTable">
              </div>
              <div class="col-6 col-md-3">
                <label class="form-label">Status</label>
                <select class="form-select">
                  <option value="">Semua Status</option>
                  <option>Draft</option>
                  <option>Aktif</option>
                  <option>Selesai</option>
                  <option>Dibatalkan</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <label class="form-label">Tahun</label>
                <select class="form-select">
                  <option value="">Semua</option>
                  <option>2024</option>
                  <option>2023</option>
                </select>
              </div>
              <div class="col-12 col-md-2">
                <button class="btn btn-primary w-100">Filter</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Tender Table -->
        <div class="card">
          <div class="table-wrap">
            <table class="table" id="tenderTable">
              <thead>
                <tr>
                  <th>Nama Paket</th>
                  <th>Jenis</th>
                  <th>Metode</th>
                  <th>Status</th>
                  <th>Pagu</th>
                  <th>HPS</th>
                  <th style="width:120px;">Aksi</th>
                </tr>
              </thead>
              <tbody id="tenderTableBody">
                <!-- Rendered by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/sidebar.js?v=3"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script>
    async function loadTenderTable() {
      const data = await fetchData('data/tenders.json');
      const tbody = document.getElementById('tenderTableBody');
      if (!data) return;

      tbody.innerHTML = data.map(t => {
        const statusBadge = t.status === 'Aktif'
          ? '<span class="badge badge-success">Aktif</span>'
          : t.status === 'Selesai'
          ? '<span class="badge badge-default">Selesai</span>'
          : t.status === 'Draft'
          ? '<span class="badge badge-warning">Draft</span>'
          : '<span class="badge badge-danger">Dibatalkan</span>';

        return `
          <tr>
            <td>
              <div class="fw-medium">${escapeHtml(t.nama)}</div>
              <div class="text-small text-muted">${escapeHtml(t.paket)}</div>
            </td>
            <td>${escapeHtml(t.jp)}</td>
            <td>${escapeHtml(t.mp)}</td>
            <td>${statusBadge}</td>
            <td>${formatCurrency(t.nilai_pagu)}</td>
            <td>${formatCurrency(t.hps)}</td>
            <td>
              <div class="actions">
                <a href="tender-admin-form.html?id=${t.id}" class="btn btn-sm btn-secondary" title="Edit">Edit</a>
                <a href="tender-admin-tahapan.html?id=${t.id}" class="btn btn-sm btn-secondary" title="Tahapan">Tahap</a>
                <button class="btn btn-sm btn-danger" data-confirm="Yakin hapus tender ini?" title="Hapus">Hapus</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatCurrency(amount) {
      if (typeof amount !== 'number') return 'Rp. 0';
      return 'Rp. ' + amount.toLocaleString('id-ID');
    }

    loadTenderTable();
  </script>
